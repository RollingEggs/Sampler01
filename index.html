<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PADFEED — Web Sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chassis:#17140f;
    --chassis-2:#1f1a14;
    --panel:#241f18;
    --pad:#2a2420;
    --pad-border:#3d352b;
    --pad-empty-border:#4a4239;
    --amber:#ff8a34;
    --amber-dim:#7a4318;
    --teal:#33d6c0;
    --teal-dim:#175f56;
    --ink:#f1ead9;
    --ink-dim:#9a9081;
    --ink-faint:#605848;
    --danger:#ff5c5c;
    --radius:14px;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  /* iOS Safari は viewport の user-scalable=no を無視するので、
     ダブルタップでの拡大は touch-action で止める */
  html,body,header,.panel,#padbar,#pagebar,button{ touch-action:manipulation; }
  html{ background:var(--chassis); }
  html,body{
    margin:0; height:100%; overflow:hidden;
    background-color:transparent;
    color:var(--ink);
    font-family:var(--sans);
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  body{
    display:flex; flex-direction:column;
    min-height:100dvh;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    gap:10px;
  }

  /* ---------- Header (minimal bar) ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:0 4px;
  }
  header .logo{
    font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:0.1em;
    color:var(--ink-dim); display:flex; align-items:center; gap:6px;
    min-width:0; overflow:hidden;
  }
  header .logo span{color:var(--amber);}
  /* ページごとの背景(最背面。ページ切替でクロスフェードする) */
  #bg{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    transition:background .28s ease-out;
  }
  header .logo .logotext{ color:var(--ink-dim); white-space:nowrap; }
  /* 狭い画面ではロゴを畳んで、ページ番号とボタンを優先する */
  @media (max-width:389px){ .logotext{ display:none; } }
  header .logo .pagechip{ flex:none; }
  header .logo .pagechip{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em;
    color:var(--chassis); background:linear-gradient(180deg,#ffb066,var(--amber));
    border-radius:7px; padding:2px 7px; margin-left:2px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%; background:#3a2e1c; flex:none;
  }
  .dot.live{ background:var(--teal); box-shadow:0 0 6px var(--teal); }
  .hdr-actions{ display:flex; gap:5px; flex:none; }
  .chip{
    border:1px solid #332c22; background:#171310; color:var(--ink-dim);
    font-family:var(--mono); font-size:11px; font-weight:600; white-space:nowrap;
    height:30px; min-width:34px; padding:0 7px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; gap:3px;
  }
  .chip.warm{ color:var(--chassis); background:linear-gradient(180deg,#ffb066,var(--amber)); border-color:var(--amber); }
  .chip.on{ color:var(--chassis); background:linear-gradient(180deg,#5cf0dc,var(--teal)); border-color:var(--teal); }
  .chip:active{ filter:brightness(0.9); }

  /* ---------- Control panel ---------- */
  .panel{
    background:linear-gradient(180deg,var(--panel),var(--chassis-2));
    border:1px solid #362d21;
    border-radius:var(--radius);
    padding:10px;
    display:flex; flex-direction:column; gap:8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 6px 16px rgba(0,0,0,0.35);
  }
  .panel[hidden]{ display:none; }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .label{
    font-family:var(--mono); font-size:9px; letter-spacing:0.12em; color:var(--ink-faint);
    text-transform:uppercase; min-width:52px;
  }
  .segmented{
    display:flex; background:#171310; border-radius:9px; padding:2px; gap:2px;
    border:1px solid #332c22; flex:1;
  }
  .segmented button{
    flex:1; border:0; background:transparent; color:var(--ink-dim);
    font-family:var(--mono); font-size:12px; font-weight:600; padding:7px 4px;
    border-radius:7px; transition:background .12s, color .12s;
  }
  .segmented button.active{
    background:linear-gradient(180deg,#3a3024,#2b241a); color:var(--amber);
    box-shadow: inset 0 0 0 1px #4a3c28;
  }
  select.styled{
    flex:1; background:#171310; color:var(--ink); border:1px solid #332c22;
    font-family:var(--mono); font-size:12px; font-weight:600; padding:8px 6px;
    border-radius:9px; -webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  .btn{
    border:1px solid #332c22; background:#171310; color:var(--ink);
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.03em;
    padding:8px 12px; border-radius:9px; white-space:nowrap;
  }
  .btn.accent{ color:var(--chassis); background:linear-gradient(180deg,#ffb066,var(--amber)); border-color:var(--amber); }
  .btn.on{ color:var(--chassis); background:linear-gradient(180deg,#5cf0dc,var(--teal)); border-color:var(--teal); }
  .btn:active{ filter:brightness(0.9); transform:translateY(1px); }
  input[type=range]{
    flex:1; accent-color:var(--amber); height:22px;
  }

  /* ---------- Pad grid ---------- */
  .stage{ flex:1; display:flex; min-height:0; }
  /* ページ切替のスライドを切り取る窓。負のマージン+同じ量のパディングで
     パッドの影やグローが切れない余白(14px)を確保している */
  .pageview{
    flex:1; display:flex; min-height:0; overflow:hidden;
    margin:-14px; padding:14px;
  }
  #grid{
    flex:1; display:grid; gap:9px; min-height:0;
    will-change:transform;
  }
  .pad{
    /* パッドごとの色。JS が style で流し込む(--pc:原色 / lite・mid:白寄せ) */
    --pc: var(--amber);
    --pc-lite: #ffd9b8;
    --pc-mid: #ffab6e;
    --pc-a45: rgba(255,138,52,0.45);
    position:relative;
    background:linear-gradient(160deg,#332b22,var(--pad) 55%,#211c17);
    border:1px solid var(--pad-border);
    border-radius:12px;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:8px 9px 7px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -6px 10px rgba(0,0,0,0.35), 0 3px 0 rgba(0,0,0,0.4);
    overflow:hidden;
    touch-action:none;
    transition: transform .05s ease-out;
  }
  .pad::before{
    content:''; position:absolute; inset:0; border-radius:12px;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.06), transparent 55%);
  }
  /* 音が入ったパッドは色そのものが面になる(明るいパッド + 濃い文字) */
  .pad.assigned{
    background:linear-gradient(168deg, var(--pc-lite) 0%, var(--pc-mid) 100%);
    border-color:var(--pc);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 -8px 12px rgba(0,0,0,0.13),
      0 3px 0 rgba(0,0,0,0.4);
  }
  .pad.assigned::before{
    background:radial-gradient(circle at 30% 15%, rgba(255,255,255,0.42), transparent 60%);
  }
  /* 単色(SOLID)はハイライトも艶も乗せず、完全にフラットな一色にする */
  .pad.assigned.flat{
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18), 0 3px 0 rgba(0,0,0,0.4);
  }
  .pad.assigned.flat::before{ background:none; }
  .pad.empty{
    border-style:dashed; border-color:var(--pad-empty-border);
    justify-content:center; align-items:center;
  }
  .pad.empty .padnum{ display:none; }
  .pad .padnum{
    position:absolute; top:6px; left:9px; font-family:var(--mono); font-size:13px; font-weight:700;
    color:var(--ink-faint); letter-spacing:.02em; z-index:1;
  }
  .pad .padname{
    font-family:var(--sans); font-size:13px; font-weight:700; color:var(--ink);
    line-height:1.25; word-break:break-word; position:relative; z-index:1;
    max-height:3.8em; overflow:hidden;
  }
  /* 濃い面では白文字、明るい面では黒文字(面の明度から自動で決める) */
  .pad.assigned .padnum{ color:rgba(255,255,255,0.8); text-shadow:0 1px 2px rgba(0,0,0,0.3); }
  .pad.assigned .padname{ color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.35); }
  .pad.assigned.lightface .padnum{ color:rgba(20,15,8,0.6); text-shadow:none; }
  .pad.assigned.lightface .padname{ color:#140f08; text-shadow:none; }
  .pad .padempty-icon{ font-size:22px; color:var(--ink-faint); }
  .pad.playing{
    transform:scale(0.95);
    border-color:#fff;
    filter:brightness(1.15) saturate(1.15);
    box-shadow: 0 0 0 3px var(--pc), 0 0 26px var(--pc-a45);
  }
  /* 読み込めなかったときの短い赤フラッシュ */
  .pad.loaderr{
    border-color:var(--danger) !important;
    box-shadow: 0 0 0 2px rgba(255,92,92,0.5), 0 0 18px rgba(255,92,92,0.4);
  }
  /* 割当モード中は「タップ待ち」であることを示す */
  body.assign .pad{ border-color:var(--teal-dim); }
  body.assign .pad .padempty-icon{ color:var(--teal); }
  /* 割当先として選択中のパッド */
  .pad.selected{
    border-color:var(--teal); border-style:solid;
    box-shadow: 0 0 0 2px var(--teal), 0 0 18px rgba(51,214,192,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .pad.selected .padempty-icon{ color:var(--teal); }
  .pad .modetag{
    position:absolute; top:7px; right:9px; z-index:1;
    font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:.06em;
    color:rgba(255,255,255,0.75); text-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  .pad.lightface .modetag{ color:rgba(20,15,8,0.5); text-shadow:none; }
  .pad .padtag{
    position:absolute; top:6px; right:7px; z-index:1;
    font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.08em;
    color:#e9fffb; background:rgba(12,30,28,0.72); border:1px solid var(--teal);
    border-radius:6px; padding:1px 5px;
  }

  /* file input hidden */
  input[type=file]{ display:none; }

  /* ---------- 選択中パッドの操作バー ---------- */
  #padbar{
    display:flex; flex-direction:column; gap:5px;
    background:linear-gradient(180deg,var(--panel),var(--chassis-2));
    border:1px solid #362d21; border-radius:var(--radius);
    padding:6px 8px 7px;
  }
  #padbar[hidden]{ display:none; }
  .pbrow{ display:flex; align-items:center; gap:8px; }
  #padbar .pblabel{
    font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.08em;
    color:var(--teal); white-space:nowrap; flex:none;
  }
  #padModeSel{ font-size:11px; padding:6px 22px 6px 8px; flex:2; min-width:0; }
  #velSeg button{ font-size:11px; padding:5px 2px; }
  #velLabel.off{ color:var(--danger); }
  .swrow{ display:flex; gap:3px; }
  .swatch{
    flex:1; height:24px; min-width:0; padding:0;
    border:1px solid rgba(0,0,0,0.45); border-radius:6px;
  }
  .swatch.on{ box-shadow:0 0 0 2px var(--ink); }
  .chip.danger{ color:var(--danger); border-color:#5a2b2b; }

  /* ---------- アレンジ(音量 / EQ)パネル ---------- */
  #arrangebar{
    display:flex; flex-direction:column; gap:6px;
    background:linear-gradient(180deg,var(--panel),var(--chassis-2));
    border:1px solid #4a3c28; border-radius:var(--radius);
    padding:7px 9px 9px;
    box-shadow:0 8px 20px rgba(0,0,0,0.45);
  }
  #arrangebar[hidden]{ display:none; }
  #arrangeLabel{ color:var(--amber); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .faders{ display:flex; gap:6px; }
  .fader{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .fader .slot{
    height:104px; width:100%; display:flex; align-items:center; justify-content:center;
    background:#141110; border:1px solid #332c22; border-radius:9px;
  }
  /* 縦フェーダー: 横のレンジを回転させる(iOS でも確実に動く書き方) */
  .fader input[type=range]{
    width:96px; height:22px; flex:none; transform:rotate(-90deg);
  }
  .fader .fadname{
    font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.1em; color:var(--ink-faint);
  }
  .fader .fadval{
    font-family:var(--mono); font-size:10px; font-weight:700; color:var(--ink);
  }

  /* アレンジ中はパッドを縦スクロールできるようにする(パネルの下に隠れた分を出す) */
  body.arrange .pageview{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
  body.arrange #grid{
    grid-template-rows:none !important;
    grid-auto-rows:96px; align-content:start;
  }
  body.arrange .pad{ touch-action:pan-y; }

  /* ---------- 背景プリセット(⚙パネル内・表示中ページに適用) ---------- */
  #bgRow{ display:flex; gap:4px; flex:1; }
  .bgsw{
    flex:1; height:26px; min-width:0; padding:0;
    border:1px solid #332c22; border-radius:7px;
  }
  .bgsw.on{ box-shadow:0 0 0 2px var(--ink); }

  /* ---------- ページ切替バー(最下部): 面全体を左右スワイプ ---------- */
  #pagebar{
    display:flex; align-items:stretch; gap:5px;
    height:46px; flex:none;
  }
  .pgarrow{
    border:1px solid #332c22; background:#171310; color:var(--ink-dim);
    font-family:var(--mono); font-size:22px; font-weight:700; line-height:1;
    width:58px; flex:none; border-radius:11px;
  }
  .pgarrow:active{ filter:brightness(0.8); }
  #pageswipe{
    flex:1; min-width:0; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    background:linear-gradient(180deg,var(--panel),var(--chassis-2));
    border:1px solid #362d21; border-radius:11px;
    touch-action:none;
  }
  #pageswipe.drag{ border-color:var(--amber-dim); }
  #pagelabel{
    font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.1em;
    color:var(--ink); white-space:nowrap;
    transition:transform .12s ease-out;
  }
  #pagelabel span{ color:var(--amber); }
  #pagedots{ display:flex; gap:5px; pointer-events:none; }
  .pgdot{
    width:6px; height:6px; border-radius:50%; padding:0; border:0;
    background:#3a3227;
  }
  .pgdot.has{ background:var(--ink-faint); }
  .pgdot.on{ background:var(--amber); box-shadow:0 0 7px var(--amber); }
</style>
</head>
<body>

<div id="bg"></div>

<header>
  <div class="logo"><span class="dot" id="audioDot"></span><span class="logotext">PAD<span>FEED</span></span><span class="pagechip" id="pageChip">P1</span></div>
  <div class="hdr-actions">
    <button class="chip" id="arrangeBtn" aria-pressed="false">アレンジ</button>
    <button class="chip" id="assignBtn" aria-pressed="false">✎ 割当</button>
    <button class="chip" id="fileBtn">📂 ファイル</button>
    <button class="chip" id="panelBtn" aria-expanded="false" aria-controls="panel">⚙</button>
  </div>
</header>

<div class="panel" id="panel" hidden>
  <div class="row">
    <div class="label">PADS</div>
    <div class="segmented" id="padCountSeg">
      <button data-n="4">4</button>
      <button data-n="6">6</button>
      <button data-n="10" class="active">10</button>
      <button data-n="15">15</button>
    </div>
  </div>
  <div class="row">
    <div class="label">VOICE</div>
    <div class="segmented" id="voiceSeg">
      <button data-v="poly">POLY 同時に鳴らす</button>
      <button data-v="mono">MONO 1音だけ</button>
    </div>
  </div>
  <div class="row">
    <div class="label">VOL</div>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9">
    <button class="btn" id="clearBtn">🗑 ページ消去</button>
  </div>
  <div class="row">
    <div class="label">BG</div>
    <div id="bgRow"></div>
  </div>
</div>

<div id="arrangebar" hidden>
  <div class="pbrow">
    <div class="pblabel" id="arrangeLabel">パッドを押してください</div>
    <button class="chip" id="fxResetBtn">リセット</button>
  </div>
  <div class="faders" id="faders"></div>
</div>

<div id="padbar" hidden>
  <div class="pbrow">
    <div class="pblabel" id="padbarLabel">PAD 01</div>
    <select id="padModeSel" class="styled"></select>
    <button class="chip danger" id="deleteBtn" aria-label="このパッドの音を削除">🗑</button>
  </div>
  <div class="pbrow">
    <div class="pblabel" id="velLabel">VEL</div>
    <div class="segmented" id="velSeg"></div>
  </div>
  <div class="swrow" id="swGrad"></div>
  <div class="swrow" id="swFlat"></div>
</div>

<div class="stage"><div class="pageview"><div id="grid"></div></div></div>

<div id="pagebar">
  <button class="pgarrow" id="prevPage" aria-label="前のページ">‹</button>
  <div id="pageswipe" aria-label="左右にスワイプでページ切替">
    <div id="pagelabel">PAGE <span>1</span></div>
    <div id="pagedots"></div>
  </div>
  <button class="pgarrow" id="nextPage" aria-label="次のページ">›</button>
</div>

<!-- accept は付けない。iOS Safari では accept="audio/*" を指定すると
     ファイルAppの「ダウンロード」内の mp3/wav が選択不可(グレーアウト)になるため。
     代わりに読み込み時にJS側で判定する。 -->
<input type="file" id="fileInput" multiple>

<script>
(function(){
  "use strict";

  // ---------------- State ----------------
  let padCount = 10;
  // 全体設定: poly=複数パッド同時再生 / mono=常に1音だけ(他を押すとカットイン)
  let voiceMode = 'mono';
  let assignMode = false;
  let panelOpen = false;
  // 割当先として選択中のパッド。パッドをタップ → 📂 でファイルを選ぶ。
  let selectedIndex = null;
  // ファイル選択ダイアログを開いた時点の開始パッド
  let assignStartIndex = null;

  // ---------------- ページ ----------------
  // 10ページ分のパッドセット。ページを切り替えると別の音・別の色になる。
  const PAGE_COUNT = 10;
  let page = 0;
  let pages = [];               // pages[p] = { pads:[{name,buffer}], colors:['#hex' | '#hex|f'] }
  let pads = [];                // 現在のページの pads(参照)
  let padColors = [];           // 現在のページの colors(参照)
  let padModes = [];            // 現在のページの modes(参照)
  let padVels = [];             // 現在のページの vels(参照)
  let padFx = [];               // 現在のページの fx(参照)

  // 15色 × (グラデ / 単色) = 30バリエーション
  const HUES = [
    '#ff5c5c','#ff7a3c','#ff9f1c','#ffc93c','#ffe14d',
    '#c6e34a','#7bd94f','#3fd08a','#33d6c0','#35c1e8',
    '#5aa9ff','#7b8cff','#b07cff','#e070e8','#ff6fb5'
  ];

  function hexToRgba(hex, a){
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }
  // t=0 で原色、t=1 で白。パッド面のパステル調に使う
  function tint(hex, t){
    const n = parseInt(hex.slice(1), 16);
    const m = v => Math.round(v + (255 - v) * t);
    return `rgb(${m((n>>16)&255)},${m((n>>8)&255)},${m(n&255)})`;
  }
  // 色の保存形式: "#rrggbb"(グラデ) / "#rrggbb|f"(単色)
  function baseHex(v){ return (v || HUES[0]).split('|')[0]; }
  function isFlat(v){ return (v || '').endsWith('|f'); }
  function faceStops(v){
    const hex = baseHex(v);
    // 単色はフラットな1色、グラデは上をやや明るく。全体的に濃いめ。
    return isFlat(v) ? [tint(hex,0.06), tint(hex,0.06)] : [tint(hex,0.34), tint(hex,0.00)];
  }
  // 面の明るさ(相対輝度)。文字を黒にするか白にするかの判定に使う
  function faceIsLight(v){
    const hex = baseHex(v), t = isFlat(v) ? 0.06 : 0.17;   // グラデは上下の中間で判定
    const n = parseInt(hex.slice(1), 16);
    const ch = c => { const x = (c + (255 - c) * t) / 255;
                      return x <= 0.03928 ? x/12.92 : Math.pow((x + 0.055)/1.055, 2.4); };
    const l = 0.2126*ch((n>>16)&255) + 0.7152*ch((n>>8)&255) + 0.0722*ch(n&255);
    return l > 0.40;
  }
  function padFace(v){
    const [a, b] = faceStops(v);
    return `linear-gradient(168deg, ${a} 0%, ${b} 100%)`;
  }
  function defaultColor(i){ return HUES[i % HUES.length]; }
  function colorOf(i){ return padColors[i] || defaultColor(i); }

  // ページごとの背景プリセット(0 = 既定のチャコール、以降は色相ごとの暗い背景)
  function shade(hex, t){   // t=1 で真っ黒寄り
    const n = parseInt(hex.slice(1), 16);
    const m = v => Math.round(v * (1 - t) + 10 * t);
    return `rgb(${m((n>>16)&255)},${m((n>>8)&255)},${m(n&255)})`;
  }
  // ページが変わったことが一目で分かるよう、背景ははっきりした単色にする
  const BACKGROUNDS = ['#1a1610'].concat(
    ['#ff5c5c','#ff9f1c','#ffe14d','#7bd94f','#33d6c0','#35c1e8','#5aa9ff','#b07cff','#ff6fb5']
      .map(h => shade(h, 0.34))
  );

  // パッドごとの再生モード
  const PAD_MODES = [
    ['press',         'タップで再生'],
    ['release',       'リリースで再生'],
    ['hold',          '押している間だけ再生'],
    ['togglepress',   'タップ再生 / 再タップで停止'],
    ['togglerelease', 'リリース再生 / 再リリースで停止'],
    ['cutpress',      'タップでカットイン'],
    ['cutrelease',    'リリースでカットイン'],
    ['cutallpress',   'タップで全部カットイン'],
    ['cutallrelease', 'リリースで全部カットイン']
  ];
  const MODE_TAGS = {
    press:'TAP', release:'REL', hold:'HOLD',
    togglepress:'TGL', togglerelease:'TGL-R',
    cutpress:'CUT', cutrelease:'CUT-R',
    cutallpress:'ALL', cutallrelease:'ALL-R'
  };
  const DEFAULT_MODE = 'press';
  function modeOf(i){ return (padModes[i] && MODE_TAGS[padModes[i]]) ? padModes[i] : DEFAULT_MODE; }

  // パッドごとのベロシティ感度(タップの強さで音量を変える)
  const VEL_KINDS = [
    ['off',  '一定'],
    ['soft', 'SOFT'],
    ['mid',  'MID'],
    ['hard', 'HARD']
  ];
  // ref: この強さ(加速度 m/s^2 相当)で最大音量。exp: カーブの立ち上がり。
  // 感覚は使いながら調整する前提で、ここだけ触れば効き方が変わるようにしてある。
  const VEL_CURVES = {
    soft: { ref: 2.5, exp: 0.55 },
    mid:  { ref: 5.0, exp: 0.85 },
    hard: { ref: 9.0, exp: 1.15 }
  };
  const VEL_MIN = 0.18;          // 弱く叩いてもこれ以下にはしない
  const VEL_TAGS = { soft:'S', mid:'M', hard:'H' };
  const DEFAULT_VEL = 'off';
  function velOf(i){ return VEL_CURVES[padVels[i]] ? padVels[i] : DEFAULT_VEL; }

  // パッドごとの音量と3バンドEQ(dB)
  const FX_DEFAULT = { vol:1, bass:0, mid:0, treble:0 };
  const EQ_RANGE = 15;          // ±15dB
  function makeFx(){ return Object.assign({}, FX_DEFAULT); }
  function fxOf(i){
    if(!padFx[i]) padFx[i] = makeFx();
    return padFx[i];
  }

  function makePage(){
    return {
      pads:   Array.from({length: padCount}, () => ({ name:null, buffer:null })),
      colors: Array.from({length: padCount}, (_, i) => defaultColor(i)),
      modes:  Array.from({length: padCount}, () => DEFAULT_MODE),
      vels:   Array.from({length: padCount}, () => DEFAULT_VEL),
      fx:     Array.from({length: padCount}, () => makeFx())
      // bg は ensurePages がページ番号ごとの既定を入れる
    };
  }
  // 全ページを padCount に合わせる(音と色は残す)
  function ensurePages(){
    while(pages.length < PAGE_COUNT) pages.push(makePage());
    pages.forEach((pg, i) => {
      if(!Array.isArray(pg.modes)) pg.modes = [];
      if(!Array.isArray(pg.vels))  pg.vels  = [];
      if(!Array.isArray(pg.fx))    pg.fx    = [];
      while(pg.pads.length   < padCount) pg.pads.push({ name:null, buffer:null });
      while(pg.colors.length < padCount) pg.colors.push(defaultColor(pg.colors.length));
      while(pg.modes.length  < padCount) pg.modes.push(DEFAULT_MODE);
      while(pg.vels.length   < padCount) pg.vels.push(DEFAULT_VEL);
      while(pg.fx.length     < padCount) pg.fx.push(makeFx());
      // 未設定なら「ページごとに違う背景」を既定にする
      if(typeof pg.bg !== 'number' || !BACKGROUNDS[pg.bg]) pg.bg = i % BACKGROUNDS.length;
    });
  }
  function usePage(p){
    page = ((p % PAGE_COUNT) + PAGE_COUNT) % PAGE_COUNT;
    pads = pages[page].pads;
    padColors = pages[page].colors;
    padModes = pages[page].modes;
    padVels = pages[page].vels;
    padFx = pages[page].fx;
  }
  function pageHasSound(p){ return pages[p].pads.some(x => x.buffer); }

  // ---------------- Audio engine ----------------
  let ctx = null;
  let master = null;
  function ensureCtx(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = parseFloat(document.getElementById('vol').value);
      master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended'){ ctx.resume(); }
    updateAudioStatus();
  }
  function updateAudioStatus(){
    const el = document.getElementById('audioDot');
    el.classList.toggle('live', !!(ctx && ctx.state === 'running'));
    el.title = (ctx && ctx.state === 'running') ? 'AUDIO READY' : 'TAP TO START AUDIO';
  }

  // ---------------- タップの強さ(ベロシティ) ----------------
  // iPhone は指の圧力を取れないため(3D Touch 廃止)、端末の加速度センサーで
  // 「叩かれた衝撃」を拾う。圧力が取れる端末では PointerEvent.pressure を使う。
  const MOTION_WINDOW = 110;     // 押下前どこまで遡って衝撃を探すか(ms)
  const MOTION_LOOKAHEAD = 70;   // 発音後に衝撃を拾い直して音量を微調整する猶予(ms)
  let motionState = 'idle';      // idle / on / denied / unsupported
  const motionLog = [];          // {t, m} 直近の衝撃
  let gravBase = 9.8;

  function onMotion(e){
    let m = null;
    const a = e.acceleration;
    if(a && (a.x !== null || a.y !== null || a.z !== null)){
      m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    } else {
      const g = e.accelerationIncludingGravity;
      if(!g) return;
      const mag = Math.hypot(g.x || 0, g.y || 0, g.z || 0);
      m = Math.abs(mag - gravBase);
      gravBase += (mag - gravBase) * 0.08;   // 重力ぶんを緩やかに追従して差し引く
    }
    motionLog.push({ t: performance.now(), m });
    if(motionLog.length > 90) motionLog.shift();
  }

  // 感度を有効にした瞬間(ユーザー操作の中)で許可を求める必要がある
  async function ensureMotion(){
    if(motionState === 'on' || motionState === 'denied') return motionState;
    if(typeof DeviceMotionEvent === 'undefined'){ motionState = 'unsupported'; return motionState; }
    try{
      if(typeof DeviceMotionEvent.requestPermission === 'function'){
        const r = await DeviceMotionEvent.requestPermission();
        if(r !== 'granted'){ motionState = 'denied'; return motionState; }
      }
      window.addEventListener('devicemotion', onMotion);
      motionState = 'on';
    }catch(err){
      motionState = 'denied';
    }
    return motionState;
  }

  function peakBetween(t0, t1){
    let peak = 0;
    for(const s of motionLog) if(s.t >= t0 && s.t <= t1 && s.m > peak) peak = s.m;
    return peak;
  }

  // 押した瞬間の強さを取っておく(リリース系のモードでも「叩いた強さ」を使う)
  const pointerVel = new Map();  // pointerId -> {pressure|null, t}
  function captureStrength(e){
    const usable = (typeof e.pressure === 'number' && e.pressure > 0 && e.pressure !== 0.5);
    pointerVel.set(e.pointerId, { pressure: usable ? e.pressure : null, t: performance.now() });
  }

  function gainFor(kind, strength){
    const c = VEL_CURVES[kind];
    if(!c) return 1;
    const x = Math.min(1, Math.max(0, strength));
    return VEL_MIN + (1 - VEL_MIN) * Math.pow(x, c.exp);
  }
  // 0..1 に正規化した叩きの強さ
  function strengthFor(kind, info, until){
    if(!info) return 1;
    if(info.pressure !== null) return info.pressure;
    const c = VEL_CURVES[kind];
    return Math.min(1, peakBetween(info.t - MOTION_WINDOW, until) / c.ref);
  }

  // 鳴っているボイスの集合。{source, gainNode, padIndex, hold, toggle, cut}
  const voices = new Set();
  const holdByPointer = new Map();   // pointerId -> voice (HOLD用)
  const pointerPad = new Map();      // pointerId -> padIndex (押下中のパッド)

  // パッドごとの EQ + 音量チェーン(ノードは使い回し、値だけ差し替える)
  const padChains = [];
  function getChain(idx){
    ensureCtx();
    let c = padChains[idx];
    if(!c){
      const low  = ctx.createBiquadFilter(); low.type  = 'lowshelf';  low.frequency.value  = 200;
      const mid  = ctx.createBiquadFilter(); mid.type  = 'peaking';   mid.frequency.value  = 1000; mid.Q.value = 1;
      const high = ctx.createBiquadFilter(); high.type = 'highshelf'; high.frequency.value = 4000;
      const gain = ctx.createGain();
      low.connect(mid); mid.connect(high); high.connect(gain); gain.connect(master);
      c = padChains[idx] = { low, mid, high, gain };
    }
    applyFx(idx);
    return c;
  }
  function applyFx(idx){
    const c = padChains[idx];
    if(!c) return;
    const f = fxOf(idx);
    c.low.gain.value  = f.bass;
    c.mid.gain.value  = f.mid;
    c.high.gain.value = f.treble;
    c.gain.gain.value = f.vol;
  }
  function applyAllFx(){ padChains.forEach((c, i) => { if(c) applyFx(i); }); }

  function playBuffer(padIndex, tags, gain){
    const p = pads[padIndex];
    if(!p || !p.buffer) return null;
    ensureCtx();
    const src = ctx.createBufferSource();
    src.buffer = p.buffer;
    const g = ctx.createGain();
    g.gain.value = (typeof gain === 'number') ? gain : 1;
    src.connect(g);
    g.connect(getChain(padIndex).low);
    const v = Object.assign({ source:src, gainNode:g, padIndex, stopping:false }, tags || {});
    src.onended = () => { voices.delete(v); refreshPadFlash(padIndex); };
    src.start(0);
    voices.add(v);
    refreshPadFlash(padIndex);
    return v;
  }

  function stopVoice(v){
    if(!v || v.stopping) return;
    v.stopping = true;
    const now = ctx.currentTime;
    try{
      v.gainNode.gain.cancelScheduledValues(now);
      v.gainNode.gain.setValueAtTime(v.gainNode.gain.value, now);
      v.gainNode.gain.linearRampToValueAtTime(0, now + 0.015);
      v.source.stop(now + 0.02);
    }catch(e){}
    voices.delete(v);
    refreshPadFlash(v.padIndex);
  }

  function stopAllVoices(){
    [...voices].forEach(stopVoice);
    holdByPointer.clear();
    pointerPad.clear();
  }
  function stopPadVoices(idx){
    [...voices].filter(v => v.padIndex === idx).forEach(stopVoice);
  }
  function padSounding(idx){
    for(const v of voices) if(v.padIndex === idx) return true;
    return false;
  }
  function refreshPadFlash(padIndex){
    const el = gridEl.children[padIndex];
    if(el) el.classList.toggle('playing', padSounding(padIndex));
  }

  // 発音開始。MONO(単体)ならこの時点で他の音を全部止める
  function startVoice(idx, tags, pointerId){
    if(voiceMode === 'mono') stopAllVoices();
    const kind = velOf(idx);
    if(kind === 'off') return playBuffer(idx, tags);

    const info = pointerVel.get(pointerId);
    const now = performance.now();
    const v = playBuffer(idx, tags, gainFor(kind, strengthFor(kind, info, now)));
    // 衝撃のピークは発音直後に届くこともあるので、少しあとで拾い直して音量を補正する
    if(v && info && info.pressure === null){
      setTimeout(() => {
        if(v.stopping) return;
        const target = gainFor(kind, strengthFor(kind, info, performance.now()));
        try{
          const t = ctx.currentTime;
          v.gainNode.gain.cancelScheduledValues(t);
          v.gainNode.gain.setValueAtTime(v.gainNode.gain.value, t);
          v.gainNode.gain.linearRampToValueAtTime(target, t + 0.02);
        }catch(err){}
      }, MOTION_LOOKAHEAD);
    }
    return v;
  }

  // パッドごとのモードに沿って、押した/離した瞬間の動作を決める
  function trigger(idx, phase, pointerId){
    const m = modeOf(idx);
    const onPress = phase === 'press';
    switch(m){
      case 'press':   if(onPress) startVoice(idx, {}, pointerId); break;
      case 'release': if(!onPress) startVoice(idx, {}, pointerId); break;
      case 'hold':
        if(onPress){
          const v = startVoice(idx, { hold:true }, pointerId);
          if(v) holdByPointer.set(pointerId, v);
        } else {
          const v = holdByPointer.get(pointerId);
          if(v){ stopVoice(v); holdByPointer.delete(pointerId); }
        }
        break;
      // タップ(またはリリース)で再生、もう一度で停止
      case 'togglepress':
      case 'togglerelease':
        if(onPress !== (m === 'togglepress')) break;
        if(padSounding(idx)) stopPadVoices(idx);
        else startVoice(idx, { toggle:true }, pointerId);
        break;
      // カットイン: 他のカットイン音だけを止めて差し替える
      case 'cutpress':
      case 'cutrelease':
        if(onPress !== (m === 'cutpress')) break;
        [...voices].filter(v => v.cut).forEach(stopVoice);
        startVoice(idx, { cut:true }, pointerId);
        break;
      // 全カットイン: 鳴っている音をすべて止めて差し替える
      case 'cutallpress':
      case 'cutallrelease':
        if(onPress !== (m === 'cutallpress')) break;
        stopAllVoices();
        startVoice(idx, {}, pointerId);
        break;
    }
  }

  // ---------------- UI: grid ----------------
  const gridEl = document.getElementById('grid');

  function gridColsRows(n){
    // returns {cols, rows} tuned for portrait iPhone screens
    switch(n){
      case 4: return {cols:2, rows:2};
      case 6: return {cols:2, rows:3};
      case 10: return {cols:2, rows:5};
      case 15: return {cols:3, rows:5};
      default: return {cols:2, rows:Math.ceil(n/2)};
    }
  }

  // パッド数はページ共通。増やしたときは全ページに枠を足す(音と色は保持)
  function rebuildPads(newCount){
    padCount = newCount;
    ensurePages();
    usePage(page);
    applyAllFx();
    if(selectedIndex !== null && selectedIndex >= newCount) selectedIndex = null;
    if(arrangeIndex !== null && arrangeIndex >= newCount){ arrangeIndex = null; renderArrangeBar(); }
    stopAllVoices();
    renderGrid();
  }

  function renderGrid(){
    const {cols, rows} = gridColsRows(padCount);
    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    gridEl.innerHTML = '';
    for(let i=0;i<padCount;i++){
      const p = pads[i];
      const el = document.createElement('div');
      const cv = colorOf(i);
      el.className = 'pad' + (p.buffer ? ' assigned' : ' empty')
        + (isFlat(cv) ? ' flat' : '')
        + (faceIsLight(cv) ? ' lightface' : '')
        + (i === selectedIndex ? ' selected' : '');
      el.dataset.idx = i;
      const v = cv, hex = baseHex(v), stops = faceStops(v);
      el.style.setProperty('--pc', hex);
      el.style.setProperty('--pc-lite', stops[0]);
      el.style.setProperty('--pc-mid', stops[1]);
      el.style.setProperty('--pc-a45', hexToRgba(hex, 0.45));
      const tag = i === selectedIndex
        ? `<div class="padtag">選択中</div>`
        : (p.buffer ? `<div class="modetag">${MODE_TAGS[modeOf(i)]}${velOf(i) === 'off' ? '' : '·' + VEL_TAGS[velOf(i)]}</div>` : '');
      el.innerHTML = p.buffer
        ? `${tag}<div class="padnum">${i+1}</div><div class="padname">${escapeHtml(p.name)}</div>`
        : `${tag}<div class="padempty-icon">＋</div>`;
      attachPadEvents(el, i);
      gridEl.appendChild(el);
    }
    renderPadBar();
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------- Pointer / trigger logic ----------------
  function attachPadEvents(el, idx){
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      ensureCtx();
      const p = pads[idx];
      // 「✎ 割当」ON のときはパッドを選ぶだけ(色の変更・ファイル割当・削除の対象)
      if(assignMode){
        selectPad(idx);
        return;
      }
      if(arrangeMode) setArrangeTarget(idx);
      if(!p.buffer) return;
      pointerPad.set(e.pointerId, idx);
      captureStrength(e);
      trigger(idx, 'press', e.pointerId);
    }, {passive:false});

    const release = (e) => {
      const idx2 = pointerPad.get(e.pointerId);
      if(idx2 === undefined) return;
      pointerPad.delete(e.pointerId);
      const p = pads[idx2];
      if(!p || !p.buffer){ pointerVel.delete(e.pointerId); return; }
      trigger(idx2, 'release', e.pointerId);
      setTimeout(() => pointerVel.delete(e.pointerId), MOTION_LOOKAHEAD + 60);
    };
    el.addEventListener('pointerup', release, {passive:false});
    el.addEventListener('pointercancel', release, {passive:false});
    el.addEventListener('pointerleave', (e) => {
      // HOLDのときだけ、指がパッドから外れたら止める(実機のパッドと同じ挙動)
      if(modeOf(idx) === 'hold') release(e);
    });
  }

  // ---------------- File assignment ----------------
  // ①パッドをタップして割当先を選択 → ②📂 でファイルを選ぶ → そのパッドから順に割り当て
  const fileInput = document.getElementById('fileInput');

  function selectPad(idx){
    selectedIndex = (selectedIndex === idx) ? null : idx;
    renderGrid();
  }

  function clearSelection(){
    if(selectedIndex === null) return;
    selectedIndex = null;
    renderGrid();
  }

  document.getElementById('fileBtn').addEventListener('click', () => {
    ensureCtx();
    let start = selectedIndex;
    if(start === null) start = pads.findIndex(p => !p.buffer);   // 未選択なら最初の空きパッドから
    if(start < 0) start = 0;                                     // 空きが無ければ先頭から差し替え
    assignStartIndex = start;
    fileInput.value = '';
    fileInput.click();
  });

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    const start = assignStartIndex;
    assignStartIndex = null;
    if(!files.length || start === null) return;
    clearSelection();

    let slot = start;
    for(const f of files){
      if(slot >= pads.length) break;
      if(await assignFileToPad(slot, f)) slot++;
      else flashError(slot);
    }
  });

  // 読み込めなかったパッドを一瞬だけ赤く光らせる(ポップアップは出さない)
  function flashError(idx){
    const el = gridEl.children[idx];
    if(!el) return;
    el.classList.add('loaderr');
    setTimeout(() => { const e2 = gridEl.children[idx]; if(e2) e2.classList.remove('loaderr'); }, 900);
  }

  // 戻り値: 読み込みに成功したら true
  async function assignFileToPad(idx, file){
    ensureCtx();
    const el = gridEl.children[idx];
    if(el){ el.querySelector('.padname') && (el.querySelector('.padname').textContent = '読込中…'); }
    try{
      const arrayBuf = await file.arrayBuffer();
      const audioBuf = await ctx.decodeAudioData(arrayBuf.slice(0));
      pads[idx] = { name: file.name.replace(/\.[^.]+$/,''), buffer: audioBuf };
      renderGrid();
      return true;
    }catch(err){
      // 失敗したパッドは空きのまま残す(次のファイルがここに入る)
      renderGrid();
      return false;
    }
  }

  // ---------------- 選択中パッドの操作バー(色の変更 / 削除) ----------------
  const padbarEl = document.getElementById('padbar');
  const padbarLabel = document.getElementById('padbarLabel');
  const swatchRows = [document.getElementById('swGrad'), document.getElementById('swFlat')];

  // 上段=グラデーション15色 / 下段=単色15色(同じ列が同じ色相)
  [['', swatchRows[0]], ['|f', swatchRows[1]]].forEach(([suffix, row]) => {
    HUES.forEach(hex => {
      const v = hex + suffix;
      const b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = padFace(v);   // パッド面と同じ見え方にする
      b.dataset.color = v;
      b.setAttribute('aria-label', 'パッドの色: ' + v);
      b.addEventListener('click', () => {
        if(selectedIndex === null) return;
        padColors[selectedIndex] = v;
        saveSettings();
        renderGrid();
      });
      row.appendChild(b);
    });
  });

  // パッドごとの再生モード
  const padModeSel = document.getElementById('padModeSel');
  PAD_MODES.forEach(([value, label]) => {
    const o = document.createElement('option');
    o.value = value; o.textContent = label;
    padModeSel.appendChild(o);
  });
  padModeSel.addEventListener('change', () => {
    if(selectedIndex === null) return;
    padModes[selectedIndex] = padModeSel.value;
    stopPadVoices(selectedIndex);
    saveSettings();
    renderGrid();
  });

  // ベロシティ感度
  const velSeg = document.getElementById('velSeg');
  const velLabel = document.getElementById('velLabel');
  VEL_KINDS.forEach(([value, label]) => {
    const b = document.createElement('button');
    b.dataset.v = value; b.textContent = label;
    b.addEventListener('click', async () => {
      if(selectedIndex === null) return;
      padVels[selectedIndex] = value;
      saveSettings();
      renderGrid();
      if(value !== 'off'){
        await ensureMotion();       // 加速度センサーの許可はこのタップの中で求める
        renderPadBar();
      }
    });
    velSeg.appendChild(b);
  });

  function renderPadBar(){
    if(selectedIndex === null){ padbarEl.hidden = true; return; }
    padbarEl.hidden = false;
    padbarLabel.textContent = `P${page+1} · PAD ${String(selectedIndex+1).padStart(2,'0')}`;
    padModeSel.value = modeOf(selectedIndex);
    const vk = velOf(selectedIndex);
    [...velSeg.children].forEach(b => b.classList.toggle('active', b.dataset.v === vk));
    // センサーが使えないと強弱がつかないので、その旨をラベルで示す
    const bad = vk !== 'off' && (motionState === 'denied' || motionState === 'unsupported');
    velLabel.textContent = bad ? 'VEL 不可' : 'VEL';
    velLabel.classList.toggle('off', bad);
    const c = colorOf(selectedIndex);
    swatchRows.forEach(row => [...row.children].forEach(b => b.classList.toggle('on', b.dataset.color === c)));
  }

  // 選択中パッドの音を削除(色と選択状態はそのまま残す)
  document.getElementById('deleteBtn').addEventListener('click', () => {
    if(selectedIndex === null) return;
    stopPadVoices(selectedIndex);
    pads[selectedIndex] = { name:null, buffer:null };
    renderGrid();
  });

  // ---------------- ページ切替(最下部のバー) ----------------
  // 演奏中でも狙わずに操作できるよう、バー全体を左右スワイプ + 大きな矢印にしている
  const pagedotsEl = document.getElementById('pagedots');
  const pageLabelEl = document.getElementById('pagelabel');
  const pageSwipeEl = document.getElementById('pageswipe');
  const pageChipEl = document.getElementById('pageChip');

  // 背景プリセット(表示中のページに適用)
  const bgRowEl = document.getElementById('bgRow');
  BACKGROUNDS.forEach((css, i) => {
    const b = document.createElement('button');
    b.className = 'bgsw';
    b.style.background = css;
    b.setAttribute('aria-label', `背景 ${i+1}`);
    b.addEventListener('click', () => {
      pages[page].bg = i;
      applyBackground();
      saveSettings();
    });
    bgRowEl.appendChild(b);
  });
  for(let p = 0; p < PAGE_COUNT; p++){
    const d = document.createElement('div');
    d.className = 'pgdot';
    pagedotsEl.appendChild(d);
  }
  document.getElementById('prevPage').addEventListener('click', () => goToPage(page - 1));
  document.getElementById('nextPage').addEventListener('click', () => goToPage(page + 1));

  // スワイプ: 1回のスワイプで必ず1ページだけ動く(どれだけ大きく払っても同じ)
  const SWIPE_STEP = 46;
  let swipeId = null, swipeOrigin = 0, swipeDone = false;

  pageSwipeEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureCtx();
    swipeId = e.pointerId;
    swipeOrigin = e.clientX;
    swipeDone = false;
    pageSwipeEl.classList.add('drag');
    try{ pageSwipeEl.setPointerCapture(e.pointerId); }catch(err){}
  }, {passive:false});

  pageSwipeEl.addEventListener('pointermove', (e) => {
    if(e.pointerId !== swipeId) return;
    e.preventDefault();
    if(swipeDone) return;                // 指を離すまで追加のページ送りはしない
    const dx = e.clientX - swipeOrigin;
    if(Math.abs(dx) >= SWIPE_STEP){
      swipeDone = true;
      pageLabelEl.style.transform = '';
      goToPage(page + (dx < 0 ? 1 : -1));  // 左へ払う → 次のページ
    } else {
      pageLabelEl.style.transform = `translateX(${dx * 0.35}px)`;
    }
  }, {passive:false});

  const endSwipe = (e) => {
    if(e.pointerId !== swipeId) return;
    swipeId = null;
    pageSwipeEl.classList.remove('drag');
    pageLabelEl.style.transform = '';
    // ほとんど動かさずに離したときはタップ扱いで次のページへ
    if(!swipeDone && Math.abs(e.clientX - swipeOrigin) < 8) goToPage(page + 1);
  };
  pageSwipeEl.addEventListener('pointerup', endSwipe);
  pageSwipeEl.addEventListener('pointercancel', (e) => {
    if(e.pointerId !== swipeId) return;
    swipeId = null;
    pageSwipeEl.classList.remove('drag');
    pageLabelEl.style.transform = '';
  });

  // raw は循環前のページ番号。差の符号がそのままスライド方向になる。
  function goToPage(raw){
    const dir = raw === page ? 0 : (raw > page ? 1 : -1);
    stopAllVoices();          // ページが変わるとパッドの中身も変わるので鳴らしっぱなしを防ぐ
    selectedIndex = null;
    usePage(raw);
    applyAllFx();
    arrangeIndex = null;
    renderArrangeBar();
    renderGrid();
    renderPageBar();
    applyBackground();
    slideGrid(dir);
    saveSettings();
  }

  // 新しいページを進行方向から滑り込ませる
  function slideGrid(dir){
    if(!dir) return;
    gridEl.style.transition = 'none';
    gridEl.style.opacity = '0.3';
    gridEl.style.transform = `translateX(${dir * 100}%)`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      gridEl.style.transition = 'transform .24s cubic-bezier(.2,.7,.3,1), opacity .24s ease-out';
      gridEl.style.transform = 'translateX(0)';
      gridEl.style.opacity = '1';
    }));
  }

  const bgEl = document.getElementById('bg');
  function applyBackground(){
    bgEl.style.background = BACKGROUNDS[pages[page].bg] || BACKGROUNDS[0];
    [...bgRowEl.children].forEach((b, i) => b.classList.toggle('on', i === pages[page].bg));
  }

  function renderPageBar(){
    pageLabelEl.innerHTML = `PAGE <span>${page+1}</span> / ${PAGE_COUNT}`;
    pageChipEl.textContent = `P${page+1}`;
    [...pagedotsEl.children].forEach((b, p) => {
      b.classList.toggle('on', p === page);
      b.classList.toggle('has', p !== page && pageHasSound(p));
    });
  }

  // ---------------- Controls ----------------
  document.getElementById('padCountSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    [...e.currentTarget.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    rebuildPads(parseInt(btn.dataset.n, 10));
    saveSettings();
  });

  const voiceSeg = document.getElementById('voiceSeg');
  function setVoiceMode(v){
    voiceMode = (v === 'poly') ? 'poly' : 'mono';
    [...voiceSeg.children].forEach(b => b.classList.toggle('active', b.dataset.v === voiceMode));
  }
  voiceSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    setVoiceMode(btn.dataset.v);
    stopAllVoices();
    saveSettings();
  });

  document.getElementById('vol').addEventListener('input', (e) => {
    if(master) master.gain.value = parseFloat(e.target.value);
  });

  // 表示中ページのパッドだけ消す(他のページはそのまま)
  document.getElementById('clearBtn').addEventListener('click', () => {
    stopAllVoices();
    for(let i=0;i<pads.length;i++) pads[i] = { name:null, buffer:null };
    selectedIndex = null;
    renderGrid();
    renderPageBar();
  });

  // ---------------- アレンジ(音量 / EQ)モード ----------------
  // 音を鳴らしながら調整できるよう、押したパッドの設定がそのままパネルに出る
  const arrangeBtn = document.getElementById('arrangeBtn');
  const arrangeBar = document.getElementById('arrangebar');
  const arrangeLabel = document.getElementById('arrangeLabel');
  const fadersEl = document.getElementById('faders');
  let arrangeMode = false;
  let arrangeIndex = null;

  const FADERS = [
    { key:'vol',    name:'VOL',    min:0,          max:2,        step:0.01 },
    { key:'bass',   name:'BASS',   min:-EQ_RANGE,  max:EQ_RANGE, step:0.5 },
    { key:'mid',    name:'MID',    min:-EQ_RANGE,  max:EQ_RANGE, step:0.5 },
    { key:'treble', name:'TREBLE', min:-EQ_RANGE,  max:EQ_RANGE, step:0.5 }
  ];
  const faderInputs = {};
  const faderValues = {};

  FADERS.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'fader';
    const slot = document.createElement('div');
    slot.className = 'slot';
    const input = document.createElement('input');
    input.type = 'range'; input.min = f.min; input.max = f.max; input.step = f.step;
    input.setAttribute('aria-label', f.name);
    const name = document.createElement('div'); name.className = 'fadname'; name.textContent = f.name;
    const val  = document.createElement('div'); val.className  = 'fadval';
    slot.appendChild(input); wrap.appendChild(slot); wrap.appendChild(name); wrap.appendChild(val);
    fadersEl.appendChild(wrap);
    faderInputs[f.key] = input;
    faderValues[f.key] = val;
    input.addEventListener('input', () => {
      if(arrangeIndex === null) return;
      fxOf(arrangeIndex)[f.key] = parseFloat(input.value);
      applyFx(arrangeIndex);          // 鳴っている音にも即反映される
      renderFaderValues();
      saveSoon();
    });
  });

  function fmtFader(key, v){
    if(key === 'vol') return Math.round(v * 100) + '%';
    return (v > 0 ? '+' : '') + v.toFixed(1);
  }
  function renderFaderValues(){
    const f = arrangeIndex === null ? FX_DEFAULT : fxOf(arrangeIndex);
    FADERS.forEach(d => { faderValues[d.key].textContent = fmtFader(d.key, f[d.key]); });
  }
  function renderArrangeBar(){
    arrangeBar.hidden = !arrangeMode;
    if(!arrangeMode) return;
    const disabled = arrangeIndex === null;
    FADERS.forEach(d => {
      const f = disabled ? FX_DEFAULT : fxOf(arrangeIndex);
      faderInputs[d.key].value = f[d.key];
      faderInputs[d.key].disabled = disabled;
    });
    arrangeLabel.textContent = disabled
      ? 'パッドを押してください'
      : `PAD ${String(arrangeIndex+1).padStart(2,'0')}  ${pads[arrangeIndex].name || '(音なし)'}`;
    renderFaderValues();
  }
  function setArrangeTarget(idx){
    arrangeIndex = idx;
    renderArrangeBar();
  }
  function setArrangeMode(on){
    arrangeMode = on;
    arrangeBtn.classList.toggle('warm', on);
    arrangeBtn.setAttribute('aria-pressed', String(on));
    document.body.classList.toggle('arrange', on);
    if(!on) arrangeIndex = null;
    renderArrangeBar();
  }
  arrangeBtn.addEventListener('click', () => {
    const on = !arrangeMode;
    if(on) setAssignMode(false);      // 割当とは同時に使わない
    setArrangeMode(on);
  });

  document.getElementById('fxResetBtn').addEventListener('click', () => {
    if(arrangeIndex === null) return;
    padFx[arrangeIndex] = makeFx();
    applyFx(arrangeIndex);
    renderArrangeBar();
    saveSettings();
  });

  let saveTimer = null;
  function saveSoon(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveSettings, 350);
  }

  // 割当モード: ONの間はパッドをタップするとファイル選択が開く
  const assignBtn = document.getElementById('assignBtn');
  function setAssignMode(on){
    assignMode = on;
    assignBtn.classList.toggle('on', on);
    assignBtn.setAttribute('aria-pressed', String(on));
    document.body.classList.toggle('assign', on);
    if(!on) clearSelection();
  }
  assignBtn.addEventListener('click', () => {
    const on = !assignMode;
    if(on) setArrangeMode(false);     // アレンジとは同時に使わない
    setAssignMode(on);
  });

  // コントロールパネルの折りたたみ
  const panelEl = document.getElementById('panel');
  const panelBtn = document.getElementById('panelBtn');
  function setPanelOpen(open){
    panelOpen = open;
    panelEl.hidden = !open;
    panelBtn.classList.toggle('on', open);
    panelBtn.setAttribute('aria-expanded', String(open));
  }
  panelBtn.addEventListener('click', () => { setPanelOpen(!panelOpen); saveSettings(); });

  // ---------------- Settings persistence (layout only, not audio) ----------------
  function saveSettings(){
    try{
      localStorage.setItem('padfeed_settings', JSON.stringify({
        padCount, voiceMode, panelOpen, page,
        pageColors: pages.map(pg => pg.colors),
        pageModes:  pages.map(pg => pg.modes),
        pageVels:   pages.map(pg => pg.vels),
        pageFx:     pages.map(pg => pg.fx),
        pageBg:     pages.map(pg => pg.bg)
      }));
    }catch(e){}
  }
  let legacyMode = null;   // 旧 playMode からの移行用
  function loadSettings(){
    try{
      const raw = localStorage.getItem('padfeed_settings');
      if(!raw) return;
      const s = JSON.parse(raw);
      if(s.padCount) padCount = s.padCount;
      if(s.voiceMode) voiceMode = s.voiceMode;
      // 旧形式(全体で1つの playMode)からの移行
      else if(s.playMode){
        voiceMode = s.playMode.startsWith('cut') ? 'mono' : 'poly';
        legacyMode = { cutpress:'press', cutrelease:'release' }[s.playMode] || s.playMode;
      }
      if(typeof s.panelOpen === 'boolean') panelOpen = s.panelOpen;
      const isColorArray = a => Array.isArray(a) && a.every(c => typeof c === 'string');
      if(Array.isArray(s.pageColors)){
        pages = s.pageColors.filter(isColorArray).slice(0, PAGE_COUNT)
                  .map(colors => ({ pads:[], colors: colors.slice(), modes:[], vels:[], fx:[] }));
      } else if(isColorArray(s.padColors)){
        pages = [{ pads:[], colors: s.padColors.slice(), modes:[], vels:[], fx:[] }];  // 旧形式(単一ページ)
      }
      if(Array.isArray(s.pageFx)){
        s.pageFx.forEach((arr, i) => {
          if(!pages[i] || !Array.isArray(arr)) return;
          pages[i].fx = arr.map(o => Object.assign(makeFx(), o && typeof o === 'object' ? o : null));
        });
      }
      if(Array.isArray(s.pageVels)){
        s.pageVels.forEach((v, i) => { if(pages[i] && isColorArray(v)) pages[i].vels = v.slice(); });
      }
      if(Array.isArray(s.pageModes)){
        s.pageModes.forEach((m, i) => { if(pages[i] && isColorArray(m)) pages[i].modes = m.slice(); });
      } else if(legacyMode){
        pages.forEach(pg => { pg.modes = new Array(padCount).fill(legacyMode); });
      }
      if(Array.isArray(s.pageBg) && s.pageBg.some(v => v)){
        s.pageBg.forEach((v, i) => { if(pages[i]) pages[i].bg = v; });
      }
      if(typeof s.page === 'number') page = s.page;
    }catch(e){}
  }

  // ---------------- Init ----------------
  loadSettings();
  // sync UI to loaded settings
  [...document.getElementById('padCountSeg').children].forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.n,10) === padCount);
  });
  setVoiceMode(voiceMode);
  setPanelOpen(panelOpen);
  setAssignMode(false);
  setArrangeMode(false);

  ensurePages();
  usePage(page);
  renderGrid();
  renderPageBar();
  applyBackground();

  document.body.addEventListener('pointerdown', ensureCtx, {once:false});

  window.addEventListener('resize', () => {
    // no-op; CSS grid handles reflow, dvh handles iOS toolbar resize
  });
})();
</script>
</body>
</html>
